[phases.setup]
nixPkgs = [
  "python311",
  "pango",
  "cairo",
  "gdk-pixbuf",
  "gobject-introspection",
  "libffi",
  "zlib",
  "glib",
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn pediae.wsgi:application --bind 0.0.0.0:$PORT"
