{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-3">
  <a href="{% if paciente %}{{ TENANT_PREFIX }}/pacientes/{{ paciente.pk }}/{% else %}{{ TENANT_PREFIX }}/pacientes/{% endif %}"
     class="btn btn-outline-secondary btn-sm me-2">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h5 class="mb-0 fw-bold">{{ titulo }}</h5>
</div>

<div class="card shadow-sm">
  <div class="card-body p-3 p-md-4">
    <form method="post" novalidate>
      {% csrf_token %}
      {% crispy form %}

      {% if modo_nuevo_doctora %}
      <div class="d-grid gap-2 mt-3">
        <button type="submit" name="accion" value="historia"
                class="btn btn-primary btn-touch">
          <i class="bi bi-clipboard2-pulse me-1"></i>
          Guardar e iniciar historia clínica
        </button>
        <button type="submit" name="accion" value="cita"
                class="btn btn-outline-primary btn-touch">
          <i class="bi bi-calendar-plus me-1"></i>
          Guardar y agendar cita
        </button>
        <button type="submit" name="accion" value="solo_guardar"
                class="btn btn-outline-secondary btn-touch">
          <i class="bi bi-check2 me-1"></i>
          Solo guardar paciente
        </button>
      </div>
      {% endif %}

    </form>
  </div>
</div>
{% endblock %}
