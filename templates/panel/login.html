<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ginea — Panel de administración</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: #0f0f1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel-card {
      background: #1e1b2e;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #2AACA8, #1a7a77);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .logo-icon i { font-size: 2rem; color: white; }
    h4 { color: #fff; font-weight: 700; }
    .subtitle { color: rgba(255,255,255,0.4); font-size: 0.85rem; }
    .form-control {
      background: #2a2740;
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 10px;
      padding: 0.75rem 1rem;
    }
    .form-control:focus {
      background: #2a2740;
      border-color: #2AACA8;
      color: #fff;
      box-shadow: 0 0 0 3px rgba(42,172,168,0.2);
    }
    .form-control::placeholder { color: rgba(255,255,255,0.3); }
    .form-label { color: rgba(255,255,255,0.7); font-size: 0.85rem; }
    .btn-panel {
      background: linear-gradient(135deg, #2AACA8, #1a7a77);
      border: none;
      color: white;
      border-radius: 10px;
      padding: 0.75rem;
      font-weight: 600;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn-panel:hover { opacity: 0.9; color: white; }
    .badge-admin {
      background: rgba(42,172,168,0.15);
      color: #2AACA8;
      border: 1px solid rgba(42,172,168,0.3);
      border-radius: 20px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="panel-card">
    <div class="text-center mb-4">
      <div class="logo-icon">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <span class="badge-admin mb-3 d-inline-block">Panel de administración</span>
      <h4>Ginea</h4>
      <p class="subtitle">Acceso exclusivo para administradores</p>
    </div>

    {% if error %}
    <div class="alert alert-danger border-0 rounded-3 mb-3" style="background:rgba(220,53,69,0.15);color:#ff6b6b">
      <i class="bi bi-exclamation-triangle me-1"></i>
      Credenciales incorrectas o sin permisos de administrador.
    </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" name="username" class="form-control"
          placeholder="Tu usuario" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control"
          placeholder="Tu contraseña" required>
      </div>
      <button type="submit" class="btn-panel">
        <i class="bi bi-shield-lock me-2"></i> Acceder al panel
      </button>
    </form>
  </div>
</body>
</html>
